plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

// App nativa de De1na: WebView que carga la web, con pantalla de inicio propia, GPS en segundo plano y notificaciones FCM.
def appVersion = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
def site = "de1na.app"

android {
    namespace "com.de1na.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.de1na.app"
        minSdk 24
        targetSdk 36
        versionCode appVersion
        versionName "1." + appVersion

        resValue "string", "app_name", "De1na"
        resValue "string", "start_url", "https://" + site + "/dashboard?source=app&app_version=" + appVersion
        resValue "string", "site_host", site
        buildConfigField "int", "APP_VERSION", String.valueOf(appVersion)
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            storeFile file(System.getenv("TWA_KEYSTORE_PATH") ?: "missing.jks")
            storePassword System.getenv("TWA_KEYSTORE_PASSWORD")
            keyAlias "pruebas"
            keyPassword System.getenv("TWA_KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.android.play:app-update:2.1.0"
}
