name: APK de pruebas (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-pruebas.yml"

permissions:
  contents: write

concurrency:
  group: apk-pruebas
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la clave de firma
        id: keys
        env:
          KEYSTORE_B64: ${{ secrets.TWA_PRUEBAS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TWA_PRUEBAS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Faltan los secretos TWA_PRUEBAS_KEYSTORE_B64 y TWA_PRUEBAS_KEYSTORE_PASSWORD. Ver android/README.md."
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then exit 1; fi

      - uses: actions/setup-java@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          gradle-version: "8.10.2"

      - name: Compilar y firmar el APK
        if: steps.keys.outputs.ready == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.TWA_PRUEBAS_KEYSTORE_B64 }}
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_PRUEBAS_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pruebas.jks"
          export TWA_KEYSTORE_PATH="$RUNNER_TEMP/pruebas.jks"
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/de1na-pruebas.apk"
          rm -f "$RUNNER_TEMP/pruebas.jks"

      - name: Verificar que la firma coincide con assetlinks.json
        if: steps.keys.outputs.ready == 'true'
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/de1na-pruebas.apk" | tee "$RUNNER_TEMP/certs.txt"
          EXPECTED=$(jq -r '.[0].target.sha256_cert_fingerprints[0]' public/.well-known/assetlinks.json | tr -d ':' | tr 'A-Z' 'a-z')
          grep -q "$EXPECTED" "$RUNNER_TEMP/certs.txt" || { echo "::error::La huella del APK no coincide con assetlinks.json"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          name: de1na-pruebas-apk
          path: ${{ runner.temp }}/de1na-pruebas.apk

      - name: Publicar en la versión "apk-pruebas"
        if: steps.keys.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-pruebas --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-pruebas "$RUNNER_TEMP/de1na-pruebas.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "De1na Pruebas (compilación ${{ github.run_number }})" \
            --notes "APK de pruebas generado automáticamente. Abre https://deuna-five.vercel.app a pantalla completa. No es la app oficial."
